<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SpendWise Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div>
            <h1>SpendWise</h1>
            <p>Smart Budget & Expense Tracker</p>
        </div>
    </header>

    <main class="container">

        <!-- Budget Summary -->
        <section class="summary-grid">

            <div class="summary-card">
                <h3>Total Budget</h3>
                <p id="budgetDisplay">$0.00</p>
            </div>

            <div class="summary-card">
                <h3>Total Expenses</h3>
                <p id="expenseDisplay">$0.00</p>
            </div>

            <div class="summary-card">
                <h3>Remaining Balance</h3>
                <p id="balanceDisplay">$0.00</p>
            </div>

        </section>

        <!-- Add Expense -->
        <section class="card">

            <h2>Add Expense</h2>

            <form id="expenseForm">

                <div class="form-group">
                    <label for="expenseName">Expense Name</label>

                    <input
                        type="text"
                        id="expenseName"
                        placeholder="Example: Food"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="expenseAmount">Amount</label>

                    <input
                        type="number"
                        id="expenseAmount"
                        placeholder="Example: 50"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <button type="submit">
                    Add Expense
                </button>

            </form>

        </section>

        <!-- Expense List -->
        <section class="card">

            <h2>Expense List</h2>

            <ul id="expenseList">
                <li class="empty-message">
                    No expenses added yet.
                </li>
            </ul>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 SpendWise. All rights reserved.</p>
    </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
